name: One-shot tighten uploaded alignment

on:
  push:
    branches:
      - feature/uploaded-audio-alignment

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/uploaded-audio-alignment
          fetch-depth: 0

      - name: Tighten segment evidence and generic timing messages
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/services/narration_alignment.py")
          source = path.read_text(encoding="utf-8")
          old = '''    segment_matches: list[list[tuple[_ScriptToken, RecognizedWord]]] = [
                  [] for _ in segments
              ]
              alignment_units: list[narration_timeline.NarrationAlignmentUnit] = []
          '''
          new = '''    segment_matches: list[list[tuple[_ScriptToken, RecognizedWord]]] = [
                  [] for _ in segments
              ]
              segment_token_counts = [0 for _ in segments]
              for token in script_tokens:
                  segment_token_counts[token.segment_index] += 1
              alignment_units: list[narration_timeline.NarrationAlignmentUnit] = []
          '''
          if old not in source:
              raise SystemExit("segment match insertion marker not found")
          source = source.replace(old, new, 1)

          old = '''        if not matches:
                      raise NarrationAlignmentError(
                          f"script segment {segment_index} could not be aligned to the uploaded audio"
                      )
          '''
          new = '''        token_count = segment_token_counts[segment_index - 1]
                  segment_coverage = len(matches) / token_count if token_count else 0.0
                  if not matches or segment_coverage < 0.60:
                      raise NarrationAlignmentError(
                          f"script segment {segment_index} could not be aligned reliably "
                          f"(segment coverage {segment_coverage:.0%}, required 60%)"
                      )
          '''
          if old not in source:
              raise SystemExit("segment validation marker not found")
          source = source.replace(old, new, 1)
          path.write_text(source, encoding="utf-8")

          main = Path("webui/Main.py")
          source = main.read_text(encoding="utf-8")
          replacements = {
              '"the applied Visual Shot Plan requires the matching Full Audio preview; "\n            "generate Full Audio again before starting timeline-aware generation"':
              '"the applied Visual Shot Plan requires matching narration timing; "\n            "analyze or generate the current voiceover again before timeline-aware generation"',
              '"the applied Visual Shot Plan belongs to a different voiceover preview; "\n            "regenerate the Visual Shot Plan after the current Full Audio"':
              '"the applied Visual Shot Plan belongs to different narration timing; "\n            "regenerate the Visual Shot Plan after the current voiceover"',
          }
          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit(f"Main.py message marker not found: {old}")
              source = source.replace(old, new, 1)
          main.write_text(source, encoding="utf-8")
          PY

      - name: Run focused alignment tests
        run: |
          python -m py_compile app/services/narration_alignment.py webui/Main.py

      - name: Commit fix and remove this one-shot workflow
        run: |
          rm .github/workflows/one-shot-tighten-uploaded-alignment.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/services/narration_alignment.py webui/Main.py .github/workflows/one-shot-tighten-uploaded-alignment.yml
          git commit -m "fix: require reliable evidence for every narration segment"
          git push origin HEAD:feature/uploaded-audio-alignment
